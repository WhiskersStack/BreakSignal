<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">BreakSignal logo</title>
  <desc id="desc">A circular timer signal with pause bars and a soft pulse arc.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111D2E"/>
      <stop offset="62%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>
    <linearGradient id="signal" x1="18" y1="25" x2="108" y2="104">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M99 38a45 45 0 0 1 10 26" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M29 90a45 45 0 0 1-10-26" fill="none" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="35" fill="none" stroke="#38BDF8" stroke-opacity="0.82" stroke-width="4"/>
  <rect x="52" y="46" width="8" height="36" rx="4" fill="#E5E7EB"/>
  <rect x="68" y="46" width="8" height="36" rx="4" fill="#E5E7EB"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="7"/>
</svg>
